  <text x="416" y="29" text-anchor="middle" font-family='ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="13" fill="#8a8a8a">Music CLI</text>
  <g font-family='ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="16" fill="#d8d0c6">
    <text x="41.6" y="84" textLength="182.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#f7d68a" font-weight="600">█▀▄▀█ █ █ █▀▀ █ █▀▀</text>
    <text x="252.8" y="84" textLength="86.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#f59cab" font-weight="600">█▀▀ █   █</text>
    <text x="41.6" y="106" textLength="297.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#ee7d92" font-weight="600">█ ▀ █ █▄█ ▄▄█ █ █▄▄   █▄▄ █▄▄ █</text>
    <text x="41.6" y="128" textLength="748.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#262626">──────────────────────────────────────────────────────────────────────────────</text>
    <text x="41.6" y="172" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#fff8ef" font-weight="600">Own your music.</text>
    <text x="41.6" y="194" textLength="739.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill-opacity="0.55">Your YouTube, SoundCloud, and Spotify libraries, saved to local files, played</text>
    <text x="41.6" y="216" textLength="76.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill-opacity="0.55">offline.</text>
    <text x="41.6" y="260" textLength="76.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill-opacity="0.55">Saves to</text>
    <text x="128" y="260" textLength="163.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#f7d68a">~/Music/Music CLI</text>
    <text x="41.6" y="304" textLength="182.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#fff8ef" font-weight="600">Where's your music?</text>
    <text x="41.6" y="348" textLength="9.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#f59cab">❯</text>
    <text x="60.8" y="348" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#f59cab" font-weight="600">YouTube</text>
    <text x="185.6" y="348" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill-opacity="0.55">Your public playlists</text>
    <text x="60.8" y="370" textLength="336" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill-opacity="0.55">SoundCloud   Your likes &amp; playlists</text>
    <text x="60.8" y="392" textLength="326.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill-opacity="0.55">Spotify      Your public playlists</text>
    <text x="41.6" y="436" textLength="316.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill-opacity="0.55">↑↓ Move  ·  ↵ Choose  ·  esc Skip</text>
    <text x="41.6" y="480" textLength="748.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#262626">──────────────────────────────────────────────────────────────────────────────</text>
    <text x="41.6" y="502" textLength="9.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#f7d68a">⏸</text>
    <text x="60.8" y="502" textLength="96" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#fff8ef" font-weight="600">Song Title</text>
    <text x="166.4" y="502" textLength="124.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill-opacity="0.55">· Artist Name</text>
    <text x="416" y="502" textLength="38.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#f59cab">████</text>
    <text x="454.4" y="502" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#f7d68a">███████</text>
    <text x="521.6" y="502" textLength="268.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill-opacity="0.55">░░░  1:13 / 1:37  · 80%  ⇄ ↻</text>
